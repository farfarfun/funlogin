[project]
name = "funlogin"
version = "1.0.10"
description = "FastAPI auth: register, login (JWT), QQ/WeChat/phone binding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "fastapi>=0.110", "uvicorn>=0.29", "pydantic-settings>=2.2", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.19", "asyncpg>=0.29", "aiomysql>=0.2.0", "pyjwt>=2.8", "bcrypt>=4.0", "httpx>=0.27", "alibabacloud-dysmsapi20170525>=3.0", "farlog>=1.1.7",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.optional-dependencies]
test = [ "pytest>=7.4", "pytest-asyncio>=0.23",]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funlogin"
Releases = "https://github.com/farfarfun/funlogin/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
license-files = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
